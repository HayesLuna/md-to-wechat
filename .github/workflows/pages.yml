name: Publish 墨笺 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Bound registry retries so a slow download cannot consume the test budget.
env:
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retries: '2'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Reuse downloaded packages even when package-lock.json changes.
      # npm ci still installs and verifies exactly the locked dependencies.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - name: Install dependencies
        id: dependencies
        timeout-minutes: 5
        run: npm ci --prefer-offline --no-audit --no-fund --timing
      - name: Upload dependency diagnostics
        if: failure() && steps.dependencies.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-test-${{ matrix.group }}
          path: ~/.npm/_logs
          retention-days: 7
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run tests
        run: npm test -- --project=${{ matrix.group }} --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/mojian-test-report.json
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.group }}
          path: /tmp/mojian-test-report.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures-${{ matrix.group }}
          path: /tmp/mojian-test-results
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Reuse downloaded packages even when package-lock.json changes.
      # npm ci still installs and verifies exactly the locked dependencies.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-x64-npm-
      - name: Install dependencies
        id: dependencies
        timeout-minutes: 5
        run: npm ci --prefer-offline --no-audit --no-fund --timing
      - name: Upload dependency diagnostics
        if: failure() && steps.dependencies.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-build
          path: ~/.npm/_logs
          retention-days: 7
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
