<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="90" y1="70" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F6F0E8"/>
    </linearGradient>
    <linearGradient id="paper" x1="170" y1="190" x2="370" y2="360" gradientUnits="userSpaceOnUse">
